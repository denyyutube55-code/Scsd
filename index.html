<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>J.A.R.V.I.S.</title>
<style>
:root{--jb:#00d4ff;--jg:#ffaa00;--bg:#0a0e1a;--gl:rgba(10,20,40,.85)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--jb);height:100vh;overflow:hidden;user-select:none}
#grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.05) 1px,transparent 1px);background-size:40px 40px;animation:gm 20s linear infinite;z-index:0}
@keyframes gm{to{transform:translate(40px,40px)}}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}
#hdr{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,212,255,.2);background:linear-gradient(180deg,rgba(0,20,40,.9),transparent)}
#hdr h1{font-size:16px;letter-spacing:4px;font-weight:300;text-shadow:0 0 15px rgba(0,212,255,.6)}
#sd{width:10px;height:10px;border-radius:50%;background:var(--jg);box-shadow:0 0 10px var(--jg);animation:pls 2s infinite}
@keyframes pls{50%{opacity:.4}}
#core{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;overflow-y:auto}
#rx{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.3),transparent 70%);border:2px solid rgba(0,212,255,.5);display:flex;align-items:center;justify-content:center;position:relative;transition:.3s;box-shadow:0 0 40px rgba(0,212,255,.3),inset 0 0 40px rgba(0,212,255,.1);flex-shrink:0}
#rx.active{border-color:var(--jg);box-shadow:0 0 60px rgba(255,170,0,.4),inset 0 0 60px rgba(255,170,0,.2)}
#rx.listening{animation:rp 1.5s infinite}
@keyframes rp{50%{transform:scale(1.05)}}
#rxi{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,var(--jb),rgba(0,212,255,.2) 70%);transition:.3s}
#rx.active #rxi{background:radial-gradient(circle,var(--jg),rgba(255,170,0,.2) 70%)}
#viz{position:absolute;inset:0;border-radius:50%;pointer-events:none}
#mic{margin-top:18px;width:64px;height:64px;border-radius:50%;border:2px solid var(--jb);background:rgba(0,212,255,.1);color:var(--jb);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;outline:none;flex-shrink:0}
#mic.listening{background:var(--jb);color:var(--bg);box-shadow:0 0 30px rgba(0,212,255,.6)}
#tr{margin-top:15px;padding:12px 18px;background:var(--gl);border:1px solid rgba(0,212,255,.2);border-radius:10px;min-height:55px;font-size:14px;line-height:1.5;color:#cdd;text-align:center;width:100%;max-width:600px}
#tr .u{color:var(--jg)}#tr .j{color:var(--jb)}
#mods{padding:8px 12px;display:flex;gap:6px;overflow-x:auto;border-top:1px solid rgba(0,212,255,.2);background:linear-gradient(0deg,rgba(0,20,40,.9),transparent);scrollbar-width:none}
#mods::-webkit-scrollbar{display:none}
.mb{flex-shrink:0;padding:7px 12px;border-radius:18px;border:1px solid rgba(0,212,255,.3);background:rgba(0,212,255,.05);color:var(--jb);font-size:11px;cursor:pointer;white-space:nowrap}
.mb:active{background:rgba(0,212,255,.2)}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:1000;display:none;flex-direction:column;padding:35px 20px;overflow-y:auto}
.panel.open{display:flex}
.panel h2{color:var(--jb);margin-bottom:18px;letter-spacing:3px;font-weight:300;font-size:18px}
.panel label{color:#9bd;font-size:12px;margin-top:14px;display:block}
.panel input,.panel textarea,.panel select{width:100%;padding:11px;margin-top:5px;background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.3);border-radius:8px;color:#cdd;font-size:14px;outline:none}
.panel input:focus,.panel textarea:focus{border-color:var(--jg)}
.panel button{margin-top:18px;padding:13px;border-radius:10px;border:none;background:var(--jb);color:var(--bg);font-size:15px;font-weight:bold;cursor:pointer}
.panel button.close{background:transparent;border:1px solid var(--jb);color:var(--jb)}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.panel .row button{flex:1;margin-top:0;min-width:120px}
#card{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,20,40,.98);border:2px solid var(--jb);border-radius:14px;padding:22px;max-width:90%;width:400px;z-index:9999;color:#cdd;box-shadow:0 0 40px rgba(0,212,255,.4)}
#card h3{color:var(--jb);margin-bottom:12px;font-size:16px}
#card .close{margin-top:14px;padding:10px;border-radius:8px;border:1px solid var(--jb);background:transparent;color:var(--jb);cursor:pointer;width:100%}
.game-btn{padding:10px;border-radius:8px;border:1px solid var(--jb);background:rgba(0,212,255,.1);color:var(--jb);cursor:pointer;margin:4px;font-size:13px}
.game-btn:active{background:var(--jb);color:var(--bg)}
#game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
#game-grid button{padding:18px;font-size:24px;border-radius:8px;border:1px solid var(--jb);background:rgba(0,212,255,.05);color:var(--jb);cursor:pointer;font-weight:bold}
#game-grid button:active{background:var(--jb);color:var(--bg)}
.badge{display:inline-block;padding:3px 8px;background:rgba(255,170,0,.15);border:1px solid var(--jg);border-radius:10px;color:var(--jg);font-size:10px;margin-left:6px}
</style>
</head>
<body>
<div id="grid"></div>
<div id="app">
<div id="hdr"><h1>J.A.R.V.I.S.</h1>
<div style="display:flex;gap:8px;align-items:center">
<span id="sd"></span>
<button class="mb" onclick="openPanel('settings')">⚙️</button>
<button class="mb" onclick="openPanel('apps')">📚</button>
<button class="mb" onclick="openPanel('automations')">⏰</button>
</div></div>
<div id="core">
<div id="rx"><canvas id="viz"></canvas><div id="rxi"></div></div>
<button id="mic">🎤</button>
<div id="tr"><span class="j">Система готова. Слушаю вас, сэр.</span></div>
</div>
<div id="mods">
<button class="mb" data-m="weather">🌤 Погода</button>
<button class="mb" data-m="time">🕐 Время</button>
<button class="mb" data-m="notes">📝 Заметки</button>
<button class="mb" data-m="todo">✅ Дела</button>
<button class="mb" data-m="timer">⏱ Таймер</button>
<button class="mb" data-m="alarm">⏰ Будильник</button>
<button class="mb" data-m="pomo">🍅 Pomodoro</button>
<button class="mb" data-m="calc">🔢 Калькулятор</button>
<button class="mb" data-m="conv">📐 Конвертер</button>
<button class="mb" data-m="currency">💵 Валюты</button>
<button class="mb" data-m="crypto">₿ Крипта</button>
<button class="mb" data-m="sun">🌅 Солнце</button>
<button class="mb" data-m="world">🌍 Мировое</button>
<button class="mb" data-m="news">📰 Новости</button>
<button class="mb" data-m="fact">🎲 Факт</button>
<button class="mb" data-m="quote">💬 Цитата</button>
<button class="mb" data-m="joke">😄 Анекдот</button>
<button class="mb" data-m="trivia">🧠 Викторина</button>
<button class="mb" data-m="game">🎮 Игры</button>
<button class="mb" data-m="pass">🔐 Пароль</button>
<button class="mb" data-m="qr">📷 QR</button>
<button class="mb" data-m="bmi">⚖️ BMI</button>
<button class="mb" data-m="tip">💰 Чаевые</button>
<button class="mb" data-m="expenses">💸 Расходы</button>
<button class="mb" data-m="diary">📔 Дневник</button>
<button class="mb" data-m="shop">🛒 Покупки</button>
<button class="mb" data-m="geo">📍 Локация</button>
<button class="mb" data-m="camera">📸 Камера</button>
<button class="mb" data-m="rec">🎙 Запись</button>
<button class="mb" data-m="phone">📱 Телефон</button>
<button class="mb" data-m="devices">📡 Дом</button>
<button class="mb" data-m="scene">🎬 Сцены</button>
<button class="mb" data-m="help">❓ Помощь</button>
</div>
</div>

<div id="settings" class="panel">
<h2>⚙️ НАСТРОЙКИ</h2>
<label>ElevenLabs API Key (голос JARVIS)</label>
<input type="password" id="c-el" placeholder="xi-api-key...">
<label>ElevenLabs Voice ID</label>
<input type="text" id="c-elv" placeholder="onwK4e9ZLuTAKqWW03F9">
<label>Picovoice Access Key (Wake Word)</label>
<input type="password" id="c-pv" placeholder="AccessKey...">
<label>Groq API Key (мозг ИИ)</label>
<input type="password" id="c-gr" placeholder="gsk_...">
<label>WebSocket сервера устройств/телефона</label>
<input type="text" id="c-dws" placeholder="ws://192.168.1.100:8080">
<label>Имя пользователя (как обращаться)</label>
<input type="text" id="c-name" placeholder="Сэр">
<label>Город по умолчанию</label>
<input type="text" id="c-city" placeholder="Москва">
<div class="row">
<button onclick="saveCfg()">💾 Сохранить</button>
<button class="close" onclick="openPanel('settings')">Закрыть</button>
</div>
<label>Экспорт / Импорт данных</label>
<div class="row">
<button onclick="exportData()">📤 Экспорт</button>
<button onclick="importData()">📥 Импорт</button>
</div>
</div>

<div id="apps" class="panel">
<h2>📚 ВСЕ ВОЗМОЖНОСТИ</h2>
<div id="apps-content" style="color:#9bd;font-size:13px;line-height:1.8"></div>
<button class="close" onclick="openPanel('apps')">Закрыть</button>
</div>

<div id="automations" class="panel">
<h2>⏰ АВТОМАТИЗАЦИИ</h2>
<div style="color:#9bd;font-size:13px;margin-bottom:12px">Создавайте правила: "каждый день в 8:00 скажи погоду"</div>
<label>Время (ЧЧ:ММ)</label>
<input type="time" id="a-time">
<label>Команда для JARVIS</label>
<input type="text" id="a-cmd" placeholder="погода">
<button onclick="addAuto()">➕ Добавить</button>
<div id="auto-list" style="margin-top:20px"></div>
<button class="close" onclick="openPanel('automations')">Закрыть</button>
</div>

<script>
// ==================== КОНФИГ ====================
const CONFIG={
lang:'ru-RU',
el:localStorage.getItem('c_el')||'',
elv:localStorage.getItem('c_elv')||'onwK4e9ZLuTAKqWW03F9',
pv:localStorage.getItem('c_pv')||'',
gr:localStorage.getItem('c_gr')||'',
grModel:'llama-3.3-70b-versatile',
dws:localStorage.getItem('c_dws')||'',
name:localStorage.getItem('c_name')||'Сэр',
city:localStorage.getItem('c_city')||'Москва',
wake:'Джарвис'
};

// ==================== СОСТОЯНИЕ ====================
const S={
isL:false,isSp:false,rec:null,syn:speechSynthesis,voices:[],voice:null,
notes:J('notes',[]),todos:J('todos',[]),alarms:J('alarms',[]),autos:J('autos',[]),
expenses:J('expenses',[]),diary:J('diary',[]),shop:J('shop',[]),
history:J('history',[]),ws:null,ac:null,an:null,pv:null,
timers:[],stopwatch:null,swTime:0,pomoState:null,
mediaRecorder:null,audioChunks:[],
game:{active:null,secret:null,tries:0,board:null}
};
function J(k,v){try{return JSON.parse(localStorage.getItem('j_'+k))||v}catch(e){return v}}
function Sv(k,v){localStorage.setItem('j_'+k,JSON.stringify(v))}

// ==================== ПАНЕЛИ ====================
function openPanel(id){
const p=document.getElementById(id);
p.classList.toggle('open');
if(id==='apps'&&p.classList.contains('open'))renderApps();
if(id==='automations'&&p.classList.contains('open'))renderAutos();
}
function renderApps(){
const list=['🌤 Погода','🕐 Время/дата','🌅 Восход/закат','🌍 Мировое время','📝 Заметки','✅ Список дел','🛒 Список покупок','⏱ Таймер','⏰ Будильник','🍅 Pomodoro','⏱ Секундомер','📅 Календарь','🔢 Калькулятор','📐 Конвертер единиц','💵 Курсы валют','₿ Криптовалюты','📈 Акции','📰 Новости','🌐 Перевод','🎲 Случайный факт','💬 Цитата дня','😄 Анекдот','🧠 Викторина','🎮 Игры (Крестики, Угадай, Виселица)','🎵 Музыка/радио','🎙 Запись звука','📸 Камера','📷 QR-код','🔐 Генератор паролей','⚖️ BMI калькулятор','🎂 Возраст','💰 Чаевые','💸 Учёт расходов','📔 Дневник','💪 Мотивация','🧘 Дыхание','📍 Геолокация','🗺 Карты','🚗 Пробки','🚌 Транспорт','✈️ Авиарейсы','🌙 Фаза луны','🌊 Приливы','☀️ УФ-индекс','🌫 Качество воздуха','⚡ Магнитные бури','📊 Диаграммы','🔔 Уведомления','📞 Звонки','✉️ SMS','📶 Wi-Fi','📡 Bluetooth','🔊 Громкость','📱 Приложения','📸 Скриншот','🔍 Поиск телефона','🔋 Батарея','📨 Уведомления телефона','💡 Свет','🌡 Термостат','🔒 Замки','📹 Камеры','🎬 Сцены умного дома','⏰ Автоматизации','🧮 Калькулятор дат','🎯 Цели','💊 Напоминания о лекарствах','👥 Контакты','📚 Словарь','🌐 Сокращения','🔤 Анаграммы','🎤 Speech-to-text','🔊 Text-to-speech','🎵 Распознавание музыки','🌍 Часовые пояса','📊 Курсы ЦБ','🏦 Банки','💳 Карты','🎁 Подарки','🎬 Фильмы','🎵 Рекомендации','🍳 Рецепты','🍕 Заказ еды','🛍 Онлайн-магазины','🚕 Такси','🏨 Отели','🛫 Билеты','📦 Доставка','💡 Идеи','🧩 Загадки','🎯 Угадай число','🃏 Карточные игры','♟ Шахматы','🎲 Кубики','🪙 Монетка','📊 Статистика','🔬 Наука','📖 История','🌌 Космос','🦖 Динозавры','🐕 Животные','🌱 Растения','🧪 Химия','🔢 Математика','🌐 География','🎨 Искусство','🎭 Театр','🎼 Ноты','📷 Фото'];
document.getElementById('apps-content').innerHTML=list.map(x=>'• '+x).join('<br>');
}
function renderAutos(){
const el=document.getElementById('auto-list');
el.innerHTML=S.autos.map((a,i)=>`<div style="padding:10px;border:1px solid rgba(0,212,255,.3);border-radius:8px;margin-top:8px;display:flex;justify-content:space-between;align-items:center"><span style="color:#cdd;font-size:13px">${a.time} → "${a.cmd}"</span><button onclick="delAuto(${i})" style="padding:6px 10px;background:transparent;border:1px solid #f55;color:#f55;border-radius:6px;font-size:11px">✕</button></div>`).join('')||'<span style="color:#678">Нет автоматизаций</span>';
}
function addAuto(){
const t=document.getElementById('a-time').value,c=document.getElementById('a-cmd').value;
if(t&&c){S.autos.push({time:t,cmd:c,last:''});Sv('autos',S.autos);renderAutos();speak('Автоматизация добавлена.')}
}
function delAuto(i){S.autos.splice(i,1);Sv('autos',S.autos);renderAutos()}
setInterval(()=>{
const now=new Date(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
S.autos.forEach((a,i)=>{if(a.time===hm&&a.last!==hm){a.last=hm;Sv('autos',S.autos);processCommand(a.cmd)}});
},30000);
function saveCfg(){
CONFIG.el=document.getElementById('c-el').value;
CONFIG.elv=document.getElementById('c-elv').value||CONFIG.elv;
CONFIG.pv=document.getElementById('c-pv').value;
CONFIG.gr=document.getElementById('c-gr').value;
CONFIG.dws=document.getElementById('c-dws').value;
CONFIG.name=document.getElementById('c-name').value||'Сэр';
CONFIG.city=document.getElementById('c-city').value||'Москва';
['c_el','c_elv','c_pv','c_gr','c_dws','c_name','c_city'].forEach((k,i)=>localStorage.setItem(k,[CONFIG.el,CONFIG.elv,CONFIG.pv,CONFIG.gr,CONFIG.dws,CONFIG.name,CONFIG.city][i]));
location.reload();
}
function exportData(){
const data={notes:S.notes,todos:S.todos,alarms:S.alarms,autos:S.autos,expenses:S.expenses,diary:S.diary,shop:S.shop};
const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jarvis-backup.json';a.click();
}
function importData(){
const i=document.createElement('input');i.type='file';i.accept='.json';
i.onchange=e=>{const f=e.target.files[0];const r=new FileReader();
r.onload=()=>{try{const d=JSON.parse(r.result);Object.assign(S,d);['notes','todos','alarms','autos','expenses','diary','shop'].forEach(k=>Sv(k,S[k]));speak('Данные импортированы.');setTimeout(()=>location.reload(),1500)}catch(ex){speak('Ошибка импорта.')}};r.readAsText(f)};
i.click();
}

// ==================== ГОЛОС (TTS) ====================
function initVoices(){
const l=()=>{S.voices=S.syn.getVoices();S.voice=S.voices.find(v=>v.lang.startsWith('ru')&&v.name.toLowerCase().includes('male'))||S.voices.find(v=>v.lang.startsWith('ru'))||S.voices[0]};
l();S.syn.onvoiceschanged=l;
}
async function speak(t,cb){
if(CONFIG.el){
try{
updateTr('j',t);S.isSp=true;document.getElementById('rx').classList.add('active');
const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${CONFIG.elv}`,{method:'POST',headers:{'xi-api-key':CONFIG.el,'Content-Type':'application/json'},body:JSON.stringify({text:t,model_id:'eleven_multilingual_v2',voice_settings:{stability:.5,similarity_boost:.75,style:.5,use_speaker_boost:true}})});
if(!r.ok)throw 0;
const b=await r.blob(),u=URL.createObjectURL(b),a=new Audio(u);
a.onended=()=>{S.isSp=false;document.getElementById('rx').classList.remove('active');URL.revokeObjectURL(u);cb&&cb()};
await a.play();return;
}catch(e){}
}
if(!S.syn)return;
S.syn.cancel();
const u=new SpeechSynthesisUtterance(t);u.lang=CONFIG.lang;u.pitch=.9;u.rate=.95;
if(S.voice)u.voice=S.voice;
u.onstart=()=>{S.isSp=true;document.getElementById('rx').classList.add('active')};
u.onend=()=>{S.isSp=false;document.getElementById('rx').classList.remove('active');cb&&cb()};
S.syn.speak(u);updateTr('j',t);
}

// ==================== STT ====================
function initRec(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)return null;
const r=new SR();r.lang=CONFIG.lang;r.continuous=false;r.interimResults=false;
r.onstart=()=>{S.isL=true;document.getElementById('mic').classList.add('listening');document.getElementById('rx').classList.add('listening')};
r.onresult=e=>{const t=e.results[0][0].transcript.toLowerCase();updateTr('u',t);processCommand(t)};
r.onerror=e=>{if(e.error==='not-allowed')speak('Разрешите микрофон в настройках Safari.');stopL()};
r.onend=()=>stopL();return r;
}
function startL(){if(S.isSp)S.syn.cancel();if(!S.rec)S.rec=initRec();if(S.rec){try{S.rec.start()}catch(e){}}}
function stopL(){S.isL=false;document.getElementById('mic').classList.remove('listening');document.getElementById('rx').classList.remove('listening')}

// ==================== ВИЗУАЛИЗАТОР ====================
function initViz(){
const c=document.getElementById('viz'),ctx=c.getContext('2d'),rx=document.getElementById('rx');
c.width=rx.offsetWidth;c.height=rx.offsetHeight;
S.ac=new (window.AudioContext||window.webkitAudioContext)();
S.an=S.ac.createAnalyser();S.an.fftSize=256;
navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{S.ac.createMediaStreamSource(st).connect(S.an);draw()}).catch(()=>draw());
function draw(){
requestAnimationFrame(draw);
const n=S.an.frequencyBinCount,d=new Uint8Array(n);S.an.getByteFrequencyData(d);
ctx.clearRect(0,0,c.width,c.height);
const cx=c.width/2,cy=c.height/2,br=c.width*.25;
ctx.beginPath();
for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2,v=d[i]/255;const x=cx+Math.cos(a)*(br+v*20),y=cy+Math.sin(a)*(br+v*20);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
ctx.closePath();ctx.strokeStyle=S.isSp?'rgba(255,170,0,.8)':'rgba(0,212,255,.6)';ctx.lineWidth=2;ctx.stroke();
}
}

// ==================== WAKE WORD ====================
async function initWake(){
if(!CONFIG.pv)return;
try{
const {PorcupineWorker}=await import('https://cdn.jsdelivr.net/npm/@picovoice/porcupine-web@3.0.0/+esm');

// ==================== UI ====================
function updateTr(s,t){
document.getElementById('tr').innerHTML=`<span class="${s==='u'?'u':'j'}">${s==='u'?'Вы: ':'JARVIS: '}${t}</span>`;
S.history.push({s,t,ts:Date.now()});if(S.history.length>100)S.history.shift();Sv('history',S.history);
}
function card(html){
const old=document.getElementById('card');if(old)old.remove();
const c=document.createElement('div');c.id='card';c.innerHTML=html+'<button class="close" onclick="this.parentElement.remove()">Закрыть</button>';
document.body.appendChild(c);
}

// ==================== ОБРАБОТКА КОМАНД ====================
async function processCommand(c){
c=c.toLowerCase().trim();
// === ПРИВЕТСТВИЯ ===
if(/^(привет|здравствуй|хай|добрый)/.test(c)){const h=new Date().getHours();const g=h<6?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';speak(`${g}, ${CONFIG.name}. Чем могу помочь?`);return}
if(c.includes('как дела')||c.includes('как ты')){speak(`Все системы функционируют нормально, ${CONFIG.name}. Готов к работе.`);return}
if(c.includes('спасибо')){speak('Всегда к вашим услугам.')}
// === ПОГОДА ===
if(c.includes('погод')){
const m=c.match(/в\s+([а-яёa-z\s-]+)/i);const city=m?m[1].trim():CONFIG.city;
speak(`Запрашиваю погоду в ${city}...`);
try{
const g=await(await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=ru`)).json();
if(!g.results?.length){speak(`Не нашёл ${city}.`);return}
const{latitude:la,longitude:lo,name:nm}=g.results[0];
const w=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current_weather=true&hourly=temperature_2m,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,weathercode&timezone=auto&forecast_days=7`)).json();
const cu=w.current_weather,da=w.daily;
let txt=`В ${nm} сейчас ${cu.temperature}°, ветер ${cu.windspeed} км/ч. Прогноз на неделю: `;
for(let i=0;i<5;i++){txt+=`${['сегодня','завтра','послезавтра','через 3 дня','через 4 дня'][i]} от ${da.temperature_2m_min[i]}° до ${da.temperature_2m_max[i]}°. `}
speak(txt);
}catch(e){speak('Ошибка погоды.')}return;
}
// === ВРЕМЯ / ДАТА ===
if(c.includes('время')||c.includes('час')){const n=new Date();speak(`Сейчас ${n.getHours()} часов ${n.getMinutes()} минут.`);return}
if(c.includes('дата')||c.includes('число')||c.includes('день недели')){const n=new Date();speak(`Сегодня ${n.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}.`);return}
if(c.includes('сколько дней до')||c.includes('сколько осталось до')){
const m=c.match(/(?:до|до даты)\s+(.+)/i);if(m){try{const d=new Date(m[1]);const diff=Math.ceil((d-new Date())/86400000);speak(`До этой даты ${diff} дней.`)}catch(e){speak('Не понял дату.')}}return}
// === ВОСХОД/ЗАКАТ ===
if(c.includes('восход')||c.includes('закат')||c.includes('солнце')){
speak('Запрашиваю данные о солнце...');
try{
const g=await(await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(CONFIG.city)}&count=1&language=ru`)).json();
const{latitude:la,longitude:lo}=g.results[0];
const w=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&daily=sunrise,sunset&timezone=auto`)).json();
speak(`Восход в ${w.daily.sunrise[0].split('T')[1]}, закат в ${w.daily.sunset[0].split('T')[1]}.`);
}catch(e){speak('Ошибка.')}return;
}
// === МИРОВОЕ ВРЕМЯ ===
if(c.includes('время в')||c.includes('мировое время')){
const m=c.match(/время в\s+(.+)/i);const city=m?m[1].trim():'Лондон';
const zones={лондон:'Europe/London',париж:'Europe/Paris',нью:'America/New_York',токио:'Asia/Tokyo',москва:'Europe/Moscow',пекин:'Asia/Shanghai',дубай:'Asia/Dubai',сидней:'Australia/Sydney',берлин:'Europe/Berlin',лос:'America/Los_Angeles'};
const tz=zones[city]||'UTC';
const t=new Date().toLocaleString('ru-RU',{timeZone:tz,hour:'2-digit',minute:'2-digit'});
speak(`В ${city} сейчас ${t}.`);return;
}
// === ЗАМЕТКИ ===
if(/^(заметка|запиши|запомни)/.test(c)){
const t=c.replace(/^(заметка|запиши|запомни)\s*:?\s*/i,'');
if(t){S.notes.push({text:t,date:new Date().toISOString()});Sv('notes',S.notes);speak(`Записано: ${t}`)}else speak('Что записать?');return}
if(c.includes('покажи заметки')||c.includes('мои заметки')){if(!S.notes.length)speak('Заметок нет.');else{speak('Ваши заметки.');card(`<h3>📝 Заметки</h3>${S.notes.map((n,i)=>`<div style="padding:6px;border-bottom:1px solid #234">${i+1}. ${n.text}</div>`).join('')}`)}return}
if(c.includes('удали заметку')||c.includes('очисти заметки')){S.notes=[];Sv('notes',[]);speak('Заметки удалены.');return}
// === TO-DO ===
if(/^(добавь дело|новое дело|создай задачу)/.test(c)){
const t=c.replace(/^(добавь дело|новое дело|создай задачу)\s*/i,'');
if(t){S.todos.push({text:t,done:false,date:new Date().toISOString()});Sv('todos',S.todos);speak(`Дело добавлено: ${t}`)}return}
if(c.includes('мои дела')||c.includes('список дел')||c.includes('покажи дела')){
if(!S.todos.length)speak('Дел нет.');else{speak(`У вас ${S.todos.length} дел.`);card(`<h3>✅ Дела</h3>${S.todos.map((t,i)=>`<div style="padding:6px">${t.done?'✓':'○'} ${t.text} <button class="game-btn" onclick="toggleTodo(${i})">${t.done?'↺':'✓'}</button></div>`).join('')}`)}return}
if(c.includes('очисти дела')){S.todos=[];Sv('todos',[]);speak('Дела очищены.');return}
// === ТАЙМЕР ===
const tm=c.match(/таймер\s+(?:на\s+)?(\d+)\s*(минут|секунд|час|мин|сек)/i);
if(tm){const v=parseInt(tm[1]);const u=tm[2];
let ms=v*1000;if(u.includes('мин'))ms=v*60000;if(u.includes('час'))ms=v*3600000;
speak(`Таймер на ${v} ${u}.`);
const id=setTimeout(()=>speak(`${CONFIG.name}, время вышло!`),ms);S.timers.push(id);return}
if(c.includes('отмени все таймеры')){S.timers.forEach(clearTimeout);S.timers=[];speak('Все таймеры отменены.');return}
// === БУДИЛЬНИК ===
const am=c.match(/будильник\s+на\s+(\d{1,2}):?(\d{2})?/i);
if(am){const h=parseInt(am[1]),mi=parseInt(am[2]||0);
S.alarms.push({h,mi,active:true});Sv('alarms',S.alarms);
speak(`Будильник на ${h}:${String(mi).padStart(2,'0')} установлен.`);return}
if(c.includes('мои будильники')){if(!S.alarms.length)speak('Будильников нет.');else speak(S.alarms.map(a=>`${a.h}:${String(a.mi).padStart(2,'0')}`).join(', '));return}
if(c.includes('удали будильники')||c.includes('выключи будильники')){S.alarms=[];Sv('alarms',[]);speak('Будильники удалены.');return}
// === СЕКУНДОМЕР ===
if(c.includes('секундомер')||c.includes('старт секундомер')){startSW();return}
if(c.includes('останови секундомер')||c.includes('стоп секундомер')){stopSW();return}
// === POMODORO ===
if(c.includes('помодоро')||c.includes('pomodoro')){startPomo();return}
// === КАЛЬКУЛЯТОР ===
const cm=c.match(/(?:посчитай|вычисли|сколько будет|калькулятор)\s*(.+)/i);
if(cm){try{const e=cm[1].replace(/[^0-9+\-*/().\s]/g,'').replace(/\s/g,'').replace(/х|×/g,'*').replace(/÷/g,'/');
const r=Function('"use strict";return('+e+')')();speak(`Результат: ${r}`)}catch(e){speak('Не смог вычислить.')}return}
// === КОНВЕРТЕР ===
const cv=c.match(/переведи\s+(\d+\.?\d*)\s*(км|м|см|кг|г|фунт|миль|фут|дюйм|ц|ф|c|км\/ч|м\/с)/i);
if(cv){const v=parseFloat(cv[1]),u=cv[2].toLowerCase();
const conv={км:v*1000,м:v,см:v/100,кг:v,г:v/1000,фунт:v*.4536,миль:v*1609,фут:v*.3048,дюйм:v*.0254,c:v*9/5+32,ф:(v-32)*5/9,'км/ч':v/3.6,'м/с':v*3.6};
const out=conv[u];speak(`${v} ${u} = ${out?out.toFixed(3):'?'}`);return}
// === ВАЛЮТЫ ===
if(c.includes('курс')||c.includes('валют')){
speak('Запрашиваю курсы валют...');
try{const r=await(await fetch('https://api.exchangerate-api.com/v4/latest/USD')).json();
const rub=r.rates.RUB,eur=r.rates.EUR,cny=r.rates.CNY;
speak(`1 доллар = ${rub.toFixed(2)} рублей, ${eur.toFixed(2)} евро, ${cny.toFixed(2)} юаней.`);return}catch(e){speak('Ошибка.')}}
const exc=c.match(/(\d+\.?\d*)\s*(доллар|рубл|евро|юан|фунт|йен)[а-я]*\s+в\s+(доллар|рубл|евро|юан|фунт|йен)/i);
if(exc){const v=parseFloat(exc[1]);
const codes={доллар:'USD',рубл:'RUB',евро:'EUR',юан:'CNY',фунт:'GBP',йен:'JPY'};
const from=codes[exc[2].toLowerCase().replace(/[а-я]+$/,'').substring(0,5)]||'USD';
const to=codes[exc[3].toLowerCase().replace(/[а-я]+$/,'').substring(0,5)]||'USD';
try{const r=await(await fetch(`https://api.exchangerate-api.com/v4/latest/${from}`)).json();
speak(`${v} ${from} = ${(v*r.rates[to]).toFixed(2)} ${to}`)}catch(e){speak('Ошибка.')}return}
// === КРИПТА ===
if(c.includes('биткоин')||c.includes('курс биткоина')||c.includes('крипт')){
speak('Запрашиваю криптовалюты...');
try{const r=await(await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,dogecoin&vs_currencies=usd,rub')).json();
speak(`Биткоин ${r.bitcoin.usd}$ или ${r.bitcoin.rub} рублей. Эфириум ${r.ethereum.usd}$. Solana ${r.solana.usd}$. Dogecoin ${r.dogecoin.usd}$.`);
}catch(e){speak('Ошибка.')}return}
// === НОВОСТИ ===
if(c.includes('новост')){
speak('Открываю новости...');
window.open('https://news.google.com','_blank');return}
// === СЛУЧАЙНЫЙ ФАКТ ===
if(c.includes('факт')||c.includes('расскажи что-нибудь')){
try{const r=await(await fetch('https://uselessfacts.jsph.pl/api/v2/facts/random')).json();
speak(r.text);}catch(e){speak('Знаете ли вы, что у осьминога три сердца?')}return}
// === ЦИТАТА ===
if(c.includes('цитат')||c.includes('мотивац')||c.includes('вдохнови')){
const q=['Единственный способ сделать великую работу — любить то, что ты делаешь. — Стив Джобс','Успех — это способность идти от неудачи к неудаче, не теряя энтузиазма. — Черчилль','Всё, что вы можете вообразить, реально. — Пикассо','Не бойтесь медленно идти, бойтесь стоять на месте. — Китайская пословица','Лучшее время посадить дерево было 20 лет назад. Второе лучшее — сейчас.','Дисциплина — это мост между целями и достижениями. — Джим Рон'];
speak(q[Math.floor(Math.random()*q.length)]);return}
// === АНЕКДОТ ===
if(c.includes('анекдот')||c.includes('шутк')||c.includes('рассмеши')){
const j=['Программист ставит на ночь два стакана: один с водой — если захочет пить, второй пустой — если не захочет.','— Почему программисты путают Хэллоуин и Рождество? — Потому что Oct 31 == Dec 25.','Оптимист: стакан наполовину полон. Пессимист: наполовину пуст. Программист: стакан в два раза больше, чем нужно.'];
speak(j[Math.floor(Math.random()*j.length)]);return}
// === ВИКТОРИНА ===
if(c.includes('викторин')||c.includes('вопрос')){
const q=[{q:'Сколько планет в Солнечной системе?',a:'8'},{q:'Кто написал Войну и мир?',a:'Лев Толстой'},{q:'Столица Австралии?',a:'Канберра'},{q:'Самый большой океан?',a:'Тихий'}];
const x=q[Math.floor(Math.random()*q.length)];speak(x.q);setTimeout(()=>speak('Ответ: '+x.a),5000);return}
// === ИГРЫ ===
if(c.includes('крестики')||c.includes('игра крестики')){startTicTacToe();return}
if(c.includes('угадай число')||c.includes('игра угадай')){startGuess();return}
if(c.includes('города')){startCities();return}
// === ПАРОЛЬ ===
if(c.includes('сгенерируй пароль')||c.includes('пароль')){
const m=c.match(/(\d+)/);const len=m?parseInt(m[1]):16;
const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
let p='';for(let i=0;i<len;i++)p+=chars[Math.floor(Math.random()*chars.length)];
speak('Пароль сгенерирован.');
card(`<h3>🔐 Пароль</h3><div style="font-family:monospace;font-size:16px;word-break:break-all;background:#012;padding:10px;border-radius:6px">${p}</div>`);return}
// === BMI ===
const bm=c.match(/(?:bmi|имт)\s+(\d+\.?\d*)\s+(?:кг|килограмм)?\s+(\d+\.?\d*)/i);
if(bm){const w=parseFloat(bm[1]),h=parseFloat(bm[2])/100;
const bmi=(w/(h*h)).toFixed(1);let cat=bmi<18.5?'недостаточный вес':bmi<25?'норма':bmi<30?'избыточный вес':'ожирение';
speak(`Ваш ИМТ ${bmi}. Категория: ${cat}.`);return}
// === ЧАЕВЫЕ ===
const tp=c.match(/чаевые\s+(\d+)\s+(?:от\s+)?(\d+)/i);
if(tp){const s=parseFloat(tp[1]),p=parseFloat(tp[2]);
speak(`Чаевые: ${(s*p/100).toFixed(2)}, итого: ${(s+s*p/100).toFixed(2)}`);return}
// === ВОЗРАСТ ===
const ag=c.match(/возраст\s+(\d{1,2})[.\s]+(\d{1,2})[.\s]+(\d{4})/);
if(ag){const b=new Date(ag[3],ag[2]-1,ag[1]);const age=Math.floor((new Date()-b)/31557600000);speak(`Возраст: ${age} лет.`);return}
// === РАСХОДЫ ===
if(/^(потратил|расход|заплатил)\s+/.test(c)){
const m=c.match(/(\d+\.?\d*)\s*(?:руб|рубл)?\s*(?:на\s+)?(.+)?/);
if(m){S.expenses.push({sum:parseFloat(m[1]),desc:m[2]||'',date:new Date().toISOString()});Sv('expenses',S.expenses);speak(`Записано: ${m[1]} рублей.`)}return}
if(c.includes('мои расходы')||c.includes('сколько потратил')){
const total=S.expenses.reduce((a,e)=>a+e.sum,0);
speak(`Всего потрачено: ${total.toFixed(2)} рублей за ${S.expenses.length} записей.`);return}
// === ДНЕВНИК ===
if(/^(дневник|запись в дневник)/.test(c)){
const t=c.replace(/^(дневник|запись в дневник)\s*/i,'');
if(t){S.diary.push({text:t,date:new Date().toISOString()});Sv('diary',S.diary);speak('Запись в дневник добавлена.')}return}
if(c.includes('покажи дневник')){speak(`В дневнике ${S.diary.length} записей.`);return}
// === СПИСОК ПОКУПОК ===
if(/^(купить|добавь в покупки|в список покупок)/.test(c)){
const t=c.replace(/^(купить|добавь в покупки|в список покупок)\s*/i,'');
if(t){S.shop.push({text:t,done:false});Sv('shop',S.shop);speak(`Добавлено: ${t}`)}return}
if(c.includes('список покупок')||c.includes('что купить')){
if(!S.shop.length)speak('Список покупок пуст.');else speak('Список: '+S.shop.map(x=>x.text).join(', '));return}
// === ГЕОЛОКАЦИЯ ===
if(c.includes('где я')||c.includes('моя локация')||c.includes('моё местоположение')){
speak('Определяю местоположение...');
navigator.geolocation.getCurrentPosition(p=>{
speak(`Координаты: ${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}. Точность ${p.coords.accuracy.toFixed(0)} метров.`);
window.open(`https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`,'_blank');
},e=>speak('Не удалось определить местоположение.'));return}
// === КАМЕРА ===
if(c.includes('камера')||c.includes('сделай фото')){
openCamera();return}
// === ЗАПИСЬ ЗВУКА ===
if(c.includes('запиши голос')||c.includes('запись звука')){
toggleRecording();return}
// === QR ===
if(c.includes('qr')||c.includes('куар')){openQR();return}
// === ПОИСК ===
if(c.startsWith('найди')||c.startsWith('поищи')||c.startsWith('загугли')){
const q=c.replace(/^(найди|поищи|загугли)\s*/i,'');
if(q){window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`,'_blank');speak(`Ищу ${q}.`)}return}
if(c.includes('ютуб')||c.includes('youtube')){window.open('https://www.youtube.com','_blank');speak('Открываю YouTube.');return}
if(c.includes('вк ')){window.open('https://vk.com','_blank');speak('Открываю ВК.');return}
if(c.includes('телеграм')){window.open('https://web.telegram.org','_blank');speak('Открываю Telegram.');return}
if(c.includes('википеди')){const q=c.replace(/.*википеди[ия]\s*/i,'');window.open(`https://ru.wikipedia.org/wiki/${encodeURIComponent(q)}`,'_blank');speak('Открываю Википедию.');return}
if(c.includes('карт')||c.includes('maps')){const q=c.replace(/.*карт[аы]\s*/i,'')||'Москва';window.open(`https://www.google.com/maps/search/${encodeURIComponent(q)}`,'_blank');speak('Открываю карты.');return}
if(c.includes('перевод')||c.includes('переведи')){
const m=c.match(/переведи\s+["«]?(.+?)["»]?\s+на\s+(\w+)/i);
if(m){window.open(`https://translate.google.com/?sl=auto&tl=${m[2]}&text=${encodeURIComponent(m[1])}`,'_blank');speak('Открываю переводчик.')}return}
// === ТЕЛЕФОН ===
if(c.includes('позвони')||c.includes('набери')){
const t=c.replace(/^(позвони|набери)\s*/i,'').trim();
if(t&&S.ws?.readyState===1){speak(`Звоню ${t}.`);S.ws.send(JSON.stringify({action:'phone',command:'call',target:t}))}
else speak('Телефон не подключён.');return}
if(c.includes('отправь смс')||c.includes('напиши сообщение')){
const m=c.match(/(?:смс|сообщение)\s+(.+?)\s+(?:текст|:|скажи)?\s*(.+)/i);
if(m&&S.ws?.readyState===1){speak('Отправляю SMS.');S.ws.send(JSON.stringify({action:'phone',command:'sms',target:m[1],text:m[2]}))}
else speak('Скажите: отправь смс [кому] текст [что].');return}
if(c.includes('wi-fi')||c.includes('вайфай')||c.includes('вай фай')){
const v=c.includes('включи');speak(`${v?'Включаю':'Выключаю'} Wi-Fi.`);
S.ws?.readyState===1&&S.ws.send(JSON.stringify({action:'phone',command:'wifi',value:v}));return}
if(c.includes('bluetooth')||c.includes('блютуз')){
const v=c.includes('включи');speak(`${v?'Включаю':'Выключаю'} Bluetooth.`);
S.ws?.readyState===1&&S.ws.send(JSON.stringify({action:'phone',command:'bluetooth',value:v}));return}
if(c.includes('громче')||c.includes('тише')||c.includes('громкость')){
let v=c.includes('тише')?'down':c.includes('громче')?'up':null;
const m=c.match(/громкость\s+(\d+)/);if(m)v=parseInt(m[1]);
speak(v==='down'?'Убавляю.':v==='up'?'Прибавляю.':`Громкость ${v}.`);
S.ws?.readyState===1&&S.ws.send(JSON.stringify({action:'phone',command:'volume',value:v}));return}
if(c.includes('открой на телефоне')||c.includes('запусти на телефоне')){
const a=c.replace(/^(открой|запусти)\s+на\s+телефоне\s*/i,'');
if(a){speak(`Открываю ${a}.`);S.ws?.readyState===1&&S.ws.send(JSON.stringify({action:'phone',command:'open_app',target:a}))}return}
if(c.includes('скриншот')){speak('Делаю скриншот...');S.ws?.readyState===1&&S.ws.send(JSON.stringify({action:'phone',command:'screenshot'}));return}
if(c.includes('уведомления')){speak('Читаю уведомления...');S.ws?.readyState===1&&S.ws.send(JSON.stringify({action:'phone',command:'notifications'}));return}
if(c.includes('найди телефон')||c.includes('где телефон')){speak('Ищу телефон...');S.ws?.readyState===1&&S.ws.send(JSON.stringify({action:'phone',command:'find_phone'}));return}
if(c.includes('заряд')||c.includes('батарея')){
S.ws?.readyState===1?S.ws.send(JSON.stringify({action:'phone',command:'battery'})):speak('Телефон не подключён.');return}
// === УМНЫЙ ДОМ ===
if(/свет|лампа|лампочка|люстра/.test(c)&&S.ws?.readyState===1){S.ws.send(JSON.stringify({action:'light',command:c}));speak('Отправлено.');return}
if(/термостат|температур[ау] в доме/.test(c)&&S.ws?.readyState===1){S.ws.send(JSON.stringify({action:'thermostat',command:c}));speak('Отправлено.');return}
if(/замок|запри|открой дверь/.test(c)&&S.ws?.readyState===1){S.ws.send(JSON.stringify({action:'lock',command:c}));speak('Отправлено.');return}
if(/камер[аы] наблюдения|покажи камеру/.test(c)&&S.ws?.readyState===1){S.ws.send(JSON.stringify({action:'camera',command:c}));speak('Отправлено.');return}
// СЦЕНЫ
if(c.includes('сцена')||c.includes('режим')){
if(c.includes('утро')){speak('Включаю утреннюю сцену.');S.ws?.readyState===1&&S.ws.send(JSON.stringify({action:'scene',scene:'morning'}))}
else if(c.includes('ночь')){speak('Включаю ночной режим.');S.ws?.readyState===1&&S.ws.send(JSON.stringify({action:'scene',scene:'night'}))}
else if(c.includes('кино')){speak('Режим кино.');S.ws?.readyState===1&&S.ws.send(JSON.stringify({action:'scene',scene:'cinema'}))}
else if(c.includes('ушёл')||c.includes('ухожу')){speak('Режим "Ушёл".');S.ws?.readyState===1&&S.ws.send(JSON.stringify({action:'scene',scene:'away'}))}
return}
// === ПОМОЩЬ ===
if(c.includes('помощь')||c.includes('что ты умеешь')||c.includes('команды')){
speak(`Я могу: погоду, время, дату, восход, мировое время, заметки, дела, покупки, таймеры, будильники, секундомер, Pomodoro, калькулятор, конвертер, валюты, криптовалюты, новости, факты, цитаты, анекдоты, викторины, игры, пароли, BMI, возраст, чаевые, расходы, дневник, геолокацию, камеру, запись звука, QR, поиск, звонки, SMS, Wi-Fi, Bluetooth, громкость, приложения, скриншоты, уведомления, заряд телефона, умный дом, сцены, автоматизации, экспорт-импорт данных. Просто скажите, что нужно.`);
return}
// === ИИ ===
if(CONFIG.gr){
speak('Секунду...');
try{
const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':`Bearer ${CONFIG.gr}`,'Content-Type':'application/json'},body:JSON.stringify({model:CONFIG.grModel,messages:[{role:'system',content:`Ты — JARVIS из Железного человека. Обращайся к пользователю "${CONFIG.name}". Отвечай кратко, по-русски, с лёгкой формальностью.`},...S.history.slice(-5).map(h=>({role:h.s==='u'?'user':'assistant',content:h.t})),{role:'user',content:c}],max_tokens:400})});
const d=await r.json();speak(d.choices?.[0]?.message?.content||'Не понял.');
}catch(e){speak('Ошибка ИИ.')}
}else speak('Не понял команду. Скажите "помощь" для списка команд или добавьте Groq API-ключ в настройках.');
}

// ==================== ИГРЫ И ИНСТРУМЕНТЫ ====================
function startTicTacToe(){
S.game={active:'ttt',board:Array(9).fill(''),turn:'X'};
speak('Крестики-нолики. Вы играете за X. Скажите номер клетки от 1 до 9.');
renderTTT();
}
function renderTTT(){
const old=document.getElementById('card');if(old)old.remove();
const c=document.createElement('div');c.id='card';
c.innerHTML=`<h3>Крестики-нолики</h3><div id="game-grid">${S.game.board.map((v,i)=>`<button onclick="tttMove(${i})">${v||''}</button>`).join('')}</div><button class="close" onclick="this.parentElement.remove()">Выход</button>`;
document.body.appendChild(c);
}
function tttMove(i){
if(S.game.board[i]||S.game.turn!=='X')return;
S.game.board[i]='X';
if(checkTTT('X')){speak('Вы победили!');S.game.active=null;renderTTT();return}
if(!S.game.board.includes('')){speak('Ничья.');S.game.active=null;renderTTT();return}
// ИИ ход
const empty=S.game.board.map((v,i)=>v?null:i).filter(x=>x!==null);
S.game.board[empty[Math.floor(Math.random()*empty.length)]]='O';
if(checkTTT('O')){speak('Я победил.');S.game.active=null;renderTTT();return}
S.game.turn='X';renderTTT();
}
function checkTTT(p){const l=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
return l.some(x=>x.every(i=>S.game.board[i]===p))}

function startGuess(){
S.game={active:'guess',secret:Math.floor(Math.random()*100)+1,tries:0};
speak('Угадайте число от 1 до 100. Говорите "число 50".');
}
function toggleTodo(i){S.todos[i].done=!S.todos[i].done;Sv('todos',S.todos);card('');}

function startCities(){
S.game={active:'cities',used:[]};
speak('Игра в города. Назовите город. Я отвечу городом на последнюю букву.');
}
const cityDB=['Москва','Астрахань','Новгород','Дубай','Екатеринбург','Гомель','Липецк','Курск','Казань','Новосибирск'];
function handleCities(city){
if(S.game?.active!=='cities')return false;
const last=city.slice(-1);
const reply=cityDB.find(x=>x.toLowerCase().startsWith(last)&&!S.game.used.includes(x));
if(reply){S.game.used.push(city,reply);speak(reply);return true}
speak('Не знаю город на эту букву.');S.game.active=null;return true;
}

function startSW(){
S.swTime=0;clearInterval(S.stopwatch);
S.stopwatch=setInterval(()=>{S.swTime+=1},1000);
speak('Секундомер запущен.');
}
function stopSW(){clearInterval(S.stopwatch);speak(`Секундомер остановлен на ${S.swTime} секунд.`);S.swTime=0}

function startPomo(){
speak('Pomodoro: 25 минут работы. Начинаю.');
let t=25*60;
const id=setInterval(()=>{t--;if(t<=0){clearInterval(id);speak('Работа завершена. 5 минут отдыха.');setTimeout(()=>speak('Отдых закончен.'),5*60*1000)}},1000);
S.pomoState=id;
}

// ==================== КАМЕРА / ЗАПИСЬ / QR ====================
async function openCamera(){
try{
const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
const v=document.createElement('video');v.srcObject=st;v.autoplay=true;v.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);max-width:95%;border:2px solid #00d4ff;border-radius:10px;z-index:9999';
const b=document.createElement('button');b.textContent='📸 Снять';b.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:14px 28px;background:#00d4ff;color:#000;border:none;border-radius:30px;font-size:16px;z-index:10000';
b.onclick=()=>{const cv=document.createElement('canvas');cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext('2d').drawImage(v,0,0);const url=cv.toDataURL('image/png');const a=document.createElement('a');a.href=url;a.download='jarvis-photo.png';a.click();st.getTracks().forEach(t=>t.stop());v.remove();b.remove();speak('Фото сохранено.')};
document.body.appendChild(v);document.body.appendChild(b);
}catch(e){speak('Нет доступа к камере.')}
}
async function toggleRecording(){
if(S.mediaRecorder&&S.mediaRecorder.state==='recording'){S.mediaRecorder.stop();speak('Запись остановлена.');return}
try{
const st=await navigator.mediaDevices.getUserMedia({audio:true});
S.mediaRecorder=new MediaRecorder(st);S.audioChunks=[];
S.mediaRecorder.ondataavailable=e=>S.audioChunks.push(e.data);
S.mediaRecorder.onstop=()=>{const b=new Blob(S.audioChunks,{type:'audio/webm'});const u=URL.createObjectURL(b);
const a=document.createElement('a');a.href=u;a.download='jarvis-recording.webm';a.click();
st.getTracks().forEach(t=>t.stop())};
S.mediaRecorder.start();speak('Запись начата. Скажите "стоп запись" чтобы остановить.');
}catch(e){speak('Нет доступа к микрофону.')}
}
function openQR(){
card(`<h3>📷 QR-код</h3><input id="qr-in" placeholder="Текст или ссылка" style="width:100%;padding:10px;background:#012;border:1px solid #0df;color:#cdd;border-radius:6px;margin-bottom:10px"><button class="game-btn" onclick="genQR()">Создать</button><div id="qr-out" style="text-align:center;margin-top:10px"></div>`);
}
function genQR(){
const t=document.getElementById('qr-in').value;
if(!t)return;
document.getElementById('qr-out').innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(t)}" style="border-radius:8px">`;
}

// ==================== WEBSOCKET ====================
function connectWS(url){
if(S.ws)S.ws.close();
S.ws=new WebSocket(url);
S.ws.onopen=()=>{console.log('WS подключён');speak('Соединение установлено.')};
S.ws.onmessage=e=>{
try{const d=JSON.parse(e.data);
if(d.type==='battery')speak(`Заряд: ${d.level}%.`);
else if(d.type==='notifications'){
if(d.notifications?.length)speak(`${d.notifications.length} уведомлений: ${d.notifications.slice(0,3).map(n=>n.text).join('. ')}`);
else speak('Нет уведомлений.')}
else if(d.type==='screenshot'){
const i=document.createElement('img');i.src='data:image/png;base64,'+d.image;
i.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);max-width:90%;z-index:9999;border:2px solid #0df;border-radius:10px';
i.onclick=()=>i.remove();document.body.appendChild(i);speak('Скриншот получен.')}
else if(d.type==='error')speak('Ошибка: '+d.message);
}catch(ex){}
};
S.ws.onerror=e=>console.error('WS:',e);
S.ws.onclose=()=>{document.getElementById('sd').style.background='#00d4ff'};
}

// ==================== КНОПКИ ====================
document.getElementById('mic').onclick=()=>{S.isL?S.rec?.stop():startL()};
document.querySelectorAll('.mb[data-m]').forEach(b=>{
b.onclick=()=>{
const m=b.dataset.m;
const map={weather:'погода в '+CONFIG.city,time:'время',notes:'покажи заметки',todo:'мои дела',timer:'таймер на 5 минут',alarm:'мои будильники',pomo:'помодоро',calc:'посчитай 2+2',conv:'переведи 100 км в миль',currency:'курс валют',crypto:'курс биткоина',sun:'восход солнца',world:'время в Лондоне',news:'новости',fact:'факт',quote:'цитата',joke:'анекдот',trivia:'викторина',game:'крестики',pass:'сгенерируй пароль 20',qr:'qr',bmi:'bmi 70 175',tip:'чаевые 1000 15',expenses:'мои расходы',diary:'покажи дневник',shop:'список покупок',geo:'где я',camera:'камера',rec:'запиши голос',phone:'позвони',devices:'свет включи',scene:'сцена утро',help:'помощь'};
if(m==='phone'||m==='devices'){const u=prompt('WebSocket URL (напр. ws://192.168.1.100:8080):');if(u)connectWS(u);return}
processCommand(map[m]||m);
};
});

// ==================== БУДИЛЬНИКИ ====================
setInterval(()=>{
const n=new Date(),h=n.getHours(),m=n.getMinutes();
S.alarms.forEach(a=>{if(a.active&&a.h===h&&a.mi===m){speak(`Будильник! ${CONFIG.name}, пора вставать!`);a.active=false;Sv('alarms',S.alarms)}});
},20000);

// ==================== ЗАПУСК ====================
window.addEventListener('load',()=>{
initVoices();S.rec=initRec();initViz();initWake();
if(CONFIG.dws)connectWS(CONFIG.dws);
setTimeout(()=>speak(`Система JARVIS активирована. ${CONFIG.name}, чем могу помочь?`),1000);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.syn)S.syn.cancel()});
</script>
